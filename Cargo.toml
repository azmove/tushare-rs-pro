[package]
name = "tushare-rs-pro"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Rust SDK for Tushare Pro API — 77 predefined data models, 12 domains, derive macro, async/await"
repository = "https://github.com/azmove/tushare-rs-pro"
homepage = "https://github.com/azmove/tushare-rs-pro"
documentation = "https://docs.rs/tushare-rs-pro"
keywords = ["tushare", "finance", "quant", "stock", "rust-sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "tushare_api"
path = "src/lib.rs"

[workspace]
members = [".", "tushare-derive"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
rand = "0.8"
tushare-rs-pro-derive = { path = "tushare-derive", version = "0.1.1" }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-log = { version = "0.2", optional = true }

# Optional third-party type support
rust_decimal = { version = "1.0", optional = true }
bigdecimal = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true, features = ["serde"] }
uuid = { version = "1.0", optional = true, features = ["v4", "serde"] }

[features]
default = []
tracing = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-log"]

# Third-party type support features
rust_decimal = ["dep:rust_decimal"]
bigdecimal = ["dep:bigdecimal"]
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]

# Convenience feature for all third-party types
all_types = ["rust_decimal", "bigdecimal", "chrono", "uuid"]
